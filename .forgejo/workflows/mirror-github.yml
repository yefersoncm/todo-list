name: mirror-github
on:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  mirror:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Espejo a GitHub (sin force, sin prune)
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          URL="https://x-access-token:${GH_TOKEN}@github.com/yefersoncm/todo-list.git"
          if [ "$REF_TYPE" = "tag" ]; then
            git push "$URL" "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
          elif [ "$REF_NAME" = "main" ]; then
            git push "$URL" "${GITHUB_SHA}:refs/heads/main"
          else
            echo "Ref no espejable: ${REF_TYPE} ${REF_NAME}"; exit 1
          fi
